name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'jarvis-android.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack the Android project
        run: |
          mkdir android
          base64 -d jarvis-android.b64 | tar xz -C android

      - name: Build the APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-apk-${{ github.run_number }}
          name: Jarvis APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
